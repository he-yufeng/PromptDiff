[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promptdelta"
version = "0.1.0"
description = "Semantic diff for LLM prompts — compare prompt versions like git diff"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{name = "Yufeng He", email = "40085740+he-yufeng@users.noreply.github.com"}]
keywords = ["llm", "prompt", "diff", "testing", "evaluation", "regression"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "openai>=1.0",
    "click>=8.0",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=2.0"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1.0",
]

[project.scripts]
promptdiff = "promptdiff.cli:main"

[project.urls]
Homepage = "https://github.com/he-yufeng/PromptDiff"
Issues = "https://github.com/he-yufeng/PromptDiff/issues"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
